#spring.datasource.password=${DB_PASSWORD}



# --- Lifecycle & Logging ---
spring.docker.compose.lifecycle-management=none
spring.docker.compose.skip.service-connection=true
logging.level.org.apache.pdfbox.pdmodel.font.FileSystemFontProvider=ERROR
logging.level.com.zaxxer.hikari=INFO
logging.level.org.springframework.jdbc.datasource=INFO
logging.level.org.springframework.ai.google.genai=DEBUG
logging.level.org.springframework.web.client.RestTemplate=DEBUG


cache.enabled=true

