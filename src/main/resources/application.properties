spring.application.name=generator
server.port=9021

# --- API Keys (SECURED VIA ENV VARIABLES) ---
# Set these in your IDE environment variables as GEMINI_API_KEY
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY}
gemini.api.key=${GEMINI_API_KEY}

# --- Gemini Model Configuration ---
spring.ai.google.genai.embedding.options.model=text-embedding-001
spring.ai.google.genai.chat.options.model=gemini-3.1-flash-lite-preview
spring.ai.google.genai.project-id=unused
spring.ai.google.genai.embedding.options.output-dimensionality=768

# --- Vector Store (PGVector) ---
spring.ai.vectorstore.pgvector.dimensions=768
spring.ai.vectorstore.pgvector.index-type=hnsw
spring.ai.vectorstore.pgvector.initialize-schema=true

# --- Database Configuration (Left as requested) ---
spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=jdbc:postgresql://localhost:5432/insightsDb
spring.datasource.username=deladm
spring.datasource.password=D3lphi95

#spring.jpa.hibernate.ddl-auto=update
