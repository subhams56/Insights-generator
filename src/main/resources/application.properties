# ==========================================
# ANOMALY AGENT CONFIGURATION
# ==========================================

# Polling frequency in milliseconds. Default: 900000 (15 minutes). Use 10000 (10 sec) for testing.
anomaly.agent.polling-rate=900000

# Number of hours to suppress subsequent alerts for the same state/region to prevent alert fatigue.
anomaly.agent.suppression-hours=4

# The quality score below which the network is considered critically degraded (0.0 to 1.0).
anomaly.agent.threshold.quality-score=0.40

# The minimum number of dropped calls required alongside a low quality score to trigger an LLM diagnosis.
anomaly.agent.threshold.quality-drops=5

# The maximum acceptable latency (in ms) for mmWave bands (n258, n260) before triggering a hardware fault alert.
#testing value = 5 otherwise keep 100
anomaly.agent.threshold.mmwave-latency=100

# The minimum number of dropped calls clustered on a specific device + carrier combo to trigger a firmware alert.
#testing value = 100 otherwise keep 5000
anomaly.agent.threshold.device-fault-drops=5000


